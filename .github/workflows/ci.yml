name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      # Pipes default to the ANSI code page on Windows; keep test output printable.
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.lock
      # Offline: fixtures only, no secrets, no network beyond pip.
      - run: python -B tools/ci.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ruff==0.15.8
      # Unused imports/names and undefined names only; no formatting rules.
      - run: ruff check --select F401,F811,F821,F841 .

  a11y:
    # Browser check of the golden bundle: axe-core (serious/critical fail), keyboard pass,
    # 390px layout. Offline apart from pip/npm and Playwright's Chromium download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.lock
      - run: npm ci --prefix tools/a11y
      - run: npm exec --prefix tools/a11y -- playwright install --with-deps chromium
      - run: echo "BUNDLE=$(python -B tools/golden_bundle.py "$RUNNER_TEMP/golden")" >> "$GITHUB_ENV"
      - run: node tools/a11y/check.mjs "$BUNDLE" --shots "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: a11y-screenshots
          path: ${{ runner.temp }}/shots
