name: Bug
description: Something that worked, or should work, does not
labels: ["type:bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps and frequency
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Branch and SHA where observed
